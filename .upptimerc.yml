  introMessage: 'Disponibilità in tempo reale di sito, API account/licenze e aggiornamenti. **La tua posta non dipende da questi servizi**: Mailamber parla direttamente coi server email del tuo provider, quindi anche durante un''interruzione l''app continua a ricevere e inviare normalmente. · Real-time availability of the website, account/licensing API and updates. **Your mail does not depend on these services**: Mailamber talks directly to your provider''s email servers, so the app keeps receiving and sending normally even during an outage.'
  navbar:
    - title: Status
      href: /
    - title: Mailamber
      href: https://mailamber.app
    - title: Supporto · Support
      href: https://mailamber.app/contatti
